[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (DB, API)",
    "slow: Tests that take >2s",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/models_ml/training/*", "app/models_ml/export/*"]

[tool.coverage.report]
show_missing = true
fail_under = 40
