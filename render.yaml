services:
  - type: web
    name: agriconnect-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://agriconnect.pages.dev,http://localhost:3000"
      - key: PYTHON_VERSION
        value: "3.11"
